<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moon – Video Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}

:root{
  color-scheme:dark;
  --red:#e83e5a; --orange:#ff7a3d; --purple:#8b5cf6; --blue:#38bdf8;
  --green:#22c55e; --pink:#f472b6; --yellow:#f59e0b;
  --bg1:#fce4ec; --bg2:#e8d5f5; --bg3:#c8e6ff; --bg4:#d4f5e9;
}

body{
  font-family:'Outfit',-apple-system,sans-serif;color:#f2f2f5;height:100vh;overflow:hidden;
  background:linear-gradient(160deg,#0e0e12 0%,#141419 45%,#0e0e12 100%);
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}

/* Glass */
.g{
  background:rgba(26,26,32,.82);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 4px 24px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.02);
}

/* Buttons */
.b{
  background:rgba(255,255,255,.06);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.07);padding:8px 16px;border-radius:14px;
  cursor:pointer;font-size:12px;font-family:inherit;color:#c9c9d0;font-weight:500;
  transition:all .2s cubic-bezier(.4,0,.2,1);display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(255,255,255,.06);
}
.b:hover{background:rgba(255,255,255,.12);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);color:#f2f2f5}
.b:active{transform:translateY(0)}
.b.on{background:rgba(255,255,255,.14);color:#f2f2f5;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.08)}

/* Accent buttons with gradient */
.b.ac{background:linear-gradient(135deg,rgba(232,62,90,.14),rgba(255,122,61,.1));border:1px solid rgba(232,62,90,.3);color:var(--red);font-weight:700}
.b.ac:hover{background:linear-gradient(135deg,rgba(232,62,90,.22),rgba(255,122,61,.16));box-shadow:0 6px 20px rgba(232,62,90,.15)}

/* Primary button */
.btnprimary{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--red),var(--orange));
  box-shadow:0 4px 20px rgba(232,62,90,.3);transition:all .2s;
  border-radius:14px;padding:14px;font-size:14px;width:100%;
}
.btnprimary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,62,90,.4)}
.btnprimary:active{transform:translateY(0)}

/* Inputs */
.inp{
  width:100%;background:rgba(255,255,255,.07);backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,255,255,.10);border-radius:14px;
  padding:13px 18px;font-size:14px;color:#dcdce2;font-family:inherit;outline:0;
  transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.inp:focus{border-color:rgba(232,62,90,.5);background:rgba(255,255,255,.12);box-shadow:0 4px 16px rgba(232,62,90,.1)}
.inp::placeholder{color:#bbb}

/* Colored section headers */
.sh{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;padding:0 2px;margin-bottom:8px}

/* Cards */
.card{border-radius:20px;transition:all .25s cubic-bezier(.4,0,.2,1)}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.1)!important}

/* Nav tabs */
.ntab{
  flex:1;padding:10px 4px;border:none;border-bottom:2.5px solid transparent;
  background:transparent;cursor:pointer;font-size:9px;font-family:inherit;
  font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#aaa;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;
}
.ntab:hover{color:#8f8f98;background:rgba(255,255,255,.04)}
.ntab.on{border-bottom-color:var(--red);color:var(--red);background:rgba(232,62,90,.05)}
.ntab .ti{font-size:18px}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge.green{background:rgba(34,197,94,.12);color:#16a34a}
.badge.red{background:rgba(239,68,68,.12);color:#dc2626}
.badge.orange{background:rgba(245,158,11,.12);color:#d97706}
.badge.purple{background:rgba(139,92,246,.12);color:#7c3aed}
.badge.gray{background:rgba(255,255,255,.08);color:#9a9aa3}

/* Timeline */
.ph{position:absolute;top:-6px;width:3px;height:calc(100% + 12px);background:linear-gradient(180deg,var(--red),rgba(232,62,90,.3));z-index:5;pointer-events:none;border-radius:2px}
.ph::before{content:'';position:absolute;top:0;left:-4px;width:11px;height:11px;background:var(--red);border-radius:50%;box-shadow:0 0 0 3px rgba(232,62,90,.2)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,18px) scale(1.05)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes moonGlow{0%,100%{box-shadow:0 0 18px 4px rgba(200,200,230,.25),0 0 40px 8px rgba(180,180,220,.1)}50%{box-shadow:0 0 24px 8px rgba(210,210,240,.35),0 0 56px 14px rgba(180,180,220,.18)}}
.moon-logo{animation:moonGlow 3s ease-in-out infinite}

/* Colorful blob backgrounds */
.blob{position:absolute;border-radius:50%;pointer-events:none;filter:blur(0px)}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Toast notification */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);z-index:9998;padding:12px 24px;border-radius:20px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#26262e,#1b1b22);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 32px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Robot animation */
@keyframes robotBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes robotEye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes robotGlow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══ CLIP OVERLAY ANIMATIONS (CapCut-style stickers) ═══ */
@keyframes ovPopIn{0%{transform:scale(0) rotate(-15deg);opacity:0}55%{transform:scale(1.25) rotate(6deg);opacity:1}75%{transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes ovThumb{0%,100%{transform:rotate(-8deg) scale(1)}25%{transform:rotate(8deg) scale(1.15)}50%{transform:rotate(-5deg) scale(1)}}
@keyframes ovBell{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(16deg)}80%{transform:rotate(-14deg)}85%{transform:rotate(10deg)}90%{transform:rotate(-7deg)}95%{transform:rotate(3deg)}}
@keyframes ovHeartUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-160px) scale(1.1);opacity:0}}
@keyframes ovShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px) rotate(-2deg)}80%{transform:translateX(4px) rotate(2deg)}}
@keyframes ovZoomPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes ovSlideUp{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ovGlowRing{0%{box-shadow:0 0 0 0 rgba(232,62,90,.6)}100%{box-shadow:0 0 0 26px rgba(232,62,90,0)}}
@keyframes ovSparkle{0%,100%{opacity:.25;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(180deg)}}
@keyframes ovFlashBg{0%,100%{opacity:0}50%{opacity:.28}}
@keyframes ovCounter{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ═══ TEXT ANIMATION STYLES (CapCut-style animated titles) ═══ */
@keyframes txtFadeIn{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
@keyframes txtSlideUp{0%{opacity:0;transform:translateY(80px)}100%{opacity:1;transform:translateY(0)}}
@keyframes txtSlideDown{0%{opacity:0;transform:translateY(-80px)}100%{opacity:1;transform:translateY(0)}}
@keyframes txtZoomIn{0%{opacity:0;transform:scale(0) rotate(-8deg)}50%{transform:scale(1.15) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes txtBounce{0%{opacity:0;transform:translateY(60px)}45%{transform:translateY(-12px)}65%{transform:translateY(6px)}80%{transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
@keyframes txtGlitch{0%{opacity:1;transform:translate(0)}20%{transform:translate(-3px,2px);filter:hue-rotate(90deg)}40%{transform:translate(3px,-2px);filter:hue-rotate(180deg)}60%{transform:translate(-2px,-1px);filter:hue-rotate(270deg)}80%{transform:translate(2px,1px);filter:hue-rotate(360deg)}100%{opacity:1;transform:translate(0);filter:none}}
@keyframes txtTypewriter{from{width:0;border-right:3px solid #fff}to{width:100%;border-right:3px solid #fff}}
@keyframes txtPulseGlow{0%,100%{text-shadow:0 0 10px currentColor,0 0 20px currentColor,0 0 40px currentColor,0 2px 8px rgba(0,0,0,.7)}50%{text-shadow:0 0 20px currentColor,0 0 40px currentColor,0 0 60px currentColor,0 2px 8px rgba(0,0,0,.7)}}
@keyframes txtShake{0%,100%{transform:translateX(0)}10%{transform:translateX(-5px) rotate(-1deg)}30%{transform:translateX(5px) rotate(1deg)}50%{transform:translateX(-3px)}70%{transform:translateX(3px)}90%{transform:translateX(-1px)}}
@keyframes txtFlipIn{0%{opacity:0;transform:perspective(400px) rotateX(90deg)}40%{transform:perspective(400px) rotateX(-15deg)}70%{transform:perspective(400px) rotateX(10deg)}100%{opacity:1;transform:perspective(400px) rotateX(0)}}

/* ═══ SEGMENT TRANSITIONS ═══ */
@keyframes segFadeIn{from{opacity:0}to{opacity:1}}
@keyframes segSlideLeft{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes segSlideRight{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes segZoomIn{from{transform:scale(1.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes segBlurIn{from{filter:blur(20px);opacity:0}to{filter:blur(0);opacity:1}}
#pa.seg-transition video{animation-fill-mode:both}

/* ═══════════════════════════════════════
   MOBILE RESPONSIVE
   ═══════════════════════════════════════ */
@media (max-width: 768px){
  body{overflow:auto}
  input,select,textarea{font-size:16px !important}
  body:not(.device-desktop) .topbar-label{display:none !important}
  body:not(.device-desktop) .mob-hide{display:none !important}
  body:not(.device-desktop) #editorRow{flex-direction:column !important}
  body:not(.device-desktop) #editorSidebar{width:100% !important;height:auto !important;max-height:35vh;border-right:0 !important;order:2}
  body:not(.device-desktop) .editor-main-mobile{order:1}
  body:not(.device-desktop) .home-actions{grid-template-columns:1fr 1fr !important}
  body:not(.device-desktop) #adminStats{grid-template-columns:repeat(2,1fr) !important}
  body:not(.device-desktop) .ai-hero-row{flex-direction:column !important;gap:8px !important}
  body:not(.device-desktop) .home-section-pad{padding:16px 14px !important}
  body:not(.device-desktop) #pdd{width:200px !important}
  body:not(.device-desktop) #tr{flex-wrap:wrap !important;justify-content:center}
}

@media (max-width: 480px){
  body:not(.device-desktop) .home-actions{grid-template-columns:1fr !important}
}

/* ═══ DEVICE-MOBILE CLASS — CapCut Mobile Level ═══ */

/* ── Global mobile reset ── */
body.device-mobile{overflow-y:auto !important;-webkit-overflow-scrolling:touch}
body.device-mobile *{-webkit-tap-highlight-color:transparent}
body.device-mobile button{min-height:0}
body.device-mobile .inp{padding:10px 12px !important;font-size:15px !important;border-radius:10px !important}

/* ── Topbar: thin, icon-only, CapCut style ── */
body.device-mobile .topbar-label{display:none !important}
body.device-mobile .mob-hide{display:none !important}
body.device-mobile .g[style*="height:56px"]{
  height:44px !important;padding:0 8px !important;gap:2px !important;
  background:rgba(14,14,18,.97) !important;border-bottom:1px solid rgba(255,255,255,.06) !important;
  backdrop-filter:none !important
}
body.device-mobile .g[style*="height:56px"] .b{
  padding:6px 10px !important;border-radius:10px !important;border:none !important;

}

  font-size:12px !important;color:#fff !important
}
/* Logo smaller */
body.device-mobile .g[style*="height:56px"] div[style*="width:32px"]{width:26px !important;height:26px !important;border-radius:8px !important;font-size:12px !important}
body.device-mobile .g[style*="height:56px"] span[style*="font-size:18px"]{font-size:15px !important}
/* Avatar smaller */

/* ── Profile dropdown ── */
body.device-mobile #pdd{width:220px !important;right:0 !important;border-radius:14px !important}

/* ── HOME: CapCut-style grid ── */
body.device-mobile .home-section-pad{padding:14px 12px !important}
body.device-mobile .home-actions{
  grid-template-columns:1fr 1fr !important;gap:8px !important
}
body.device-mobile .home-actions>button{

}
body.device-mobile .home-actions>button:first-child{grid-column:1/-1;min-height:80px !important}

/* ── EDITOR: CapCut mobile layout ── */

body.device-mobile #vEditor{overflow-y:auto !important;-webkit-overflow-scrolling:touch;flex-direction:column !important}

  flex-direction:column !important;overflow:visible !important;flex:none !important;min-height:0 !important
}

/* Hide sidebar in editor — show it as a slide-up panel */

}

}

}

}
/* Time left */
body.device-mobile #tr>div:first-child{flex:1;min-width:0}

/* Center controls */

}

body.device-mobile #fxModal button div:nth-child(3){display:none !important}

/* ═══ LIGHT THEME — disabled, dark-only for CapCut style ═══ */
</style>

// ═══ ACTIVITY TRACKING ═══
function getActivityLog(){try{return JSON.parse(localStorage.getItem('moon_activity')||'[]')}catch(e){return[]}}
function logExport(durationSec,clipCount,segCount){
  const log=getActivityLog();
  log.push({ts:Date.now(),dur:Math.round(durationSec),clips:clipCount,segs:segCount});
  // Keep last 100 entries
  if(log.length>100)log.splice(0,log.length-100);
  try{localStorage.setItem('moon_activity',JSON.stringify(log))}catch(e){}
}
function getWeekActivity(){
  const log=getActivityLog();
  const now=new Date();
  const days=[];
  const dayNames=['Su','Mo','Tu','We','Th','Fr','Sa'];
  for(let i=6;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const dayStart=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    const dayEnd=dayStart+86400000;
    const dayEntries=log.filter(e=>e.ts>=dayStart&&e.ts<dayEnd);
    const totalDur=dayEntries.reduce((s,e)=>s+e.dur,0);
    days.push({label:dayNames[d.getDay()],date:d.getDate()+'.'+(d.getMonth()+1)+'.',count:dayEntries.length,dur:totalDur,entries:dayEntries});
  }
  return days;
}
function actFmtDur(s){
  if(s>=3600)return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';
  if(s>=60)return Math.floor(s/60)+'m '+(s%60)+'s';
  return s+'s';
}
function renderActivityChart(){
  var el=document.getElementById('homeActivity');
  if(!el)return;
  try{
    var days=getWeekActivity();
    var maxDur=1;
    for(var i=0;i<days.length;i++){if(days[i].dur>maxDur)maxDur=days[i].dur;}
    var totalVids=0,totalDur=0;
    for(var i=0;i<days.length;i++){totalVids+=days[i].count;totalDur+=days[i].dur;}
    var colors=['#8b5cf6','#a78bfa','#38bdf8','#22c55e','#f59e0b','#f97316','#e83e5a'];
    var barsHtml='';
    for(var i=0;i<days.length;i++){
      var d=days[i];
      var c=colors[i%colors.length];
      var hPct=d.dur>0?Math.max(15,Math.round((d.dur/maxDur)*100)):0;
      var barBg=d.dur>0?'linear-gradient(180deg,'+c+','+c+'88)':'rgba(255,255,255,.15)';
      var minH=d.dur>0?'10px':'6px';
      var countLabel=d.count>0?('<div style="font-size:9px;font-weight:700;color:'+c+'">'+d.count+'</div>'):'';
      barsHtml+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">'
        +countLabel
        +'<div style="width:100%;height:'+hPct+'%;min-height:'+minH+';border-radius:6px 6px 3px 3px;background:'+barBg+';transition:all .3s"></div>'
        +'<span style="font-size:9px;color:#888;font-weight:600">'+d.label+'</span>'
        +'</div>';
    }
    var emptyNote=totalVids===0?'<div style="text-align:center;padding:10px 0 4px;font-size:12px;color:#888">Zatím žádné exporty — ulož video a uvidíš aktivitu</div>':'';
    el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      +'<div style="font-size:11px;font-weight:800;color:#bbb;text-transform:uppercase;letter-spacing:1.5px">🌙 Aktivita — 7 dní</div>'
      +'<div style="display:flex;gap:12px">'
      +'<span style="font-size:11px;color:#8f8f98"><b style="color:#f2f2f5">'+totalVids+'</b> videí</span>'
      +'<span style="font-size:11px;color:#8f8f98"><b style="color:#f2f2f5">'+actFmtDur(totalDur)+'</b> celkem</span>'
      +'</div></div>'
      +'<div style="display:flex;align-items:flex-end;gap:8px;height:90px;padding-bottom:4px">'+barsHtml+'</div>'
      +emptyNote;
  }catch(e){
    el.innerHTML='<div style="padding:12px;color:#e83e5a;font-size:12px">Chyba aktivity: '+e.message+'</div>';
  }
}

  for(let i=0;i<12;i++){

// ═══ SUPABASE AUTH ═══

function doEmail(){
  const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value,err=document.getElementById('lerr');
  err.style.display='none';
  if(!e.includes('@')){err.textContent='Enter a valid email';err.style.display='block';return}
  if(p.length<6){err.textContent='Password must be at least 6 characters';err.style.display='block';return}

  const btn=document.querySelector('.btnprimary');
  const origText=btn.textContent;
  btn.textContent='Signing in...';btn.disabled=true;

  sb.auth.signInWithPassword({email:e,password:p}).then(({data,error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){
      err.textContent=error.message==='Invalid login credentials'?'Incorrect email or password':(error.message.includes('fetch')?'📡 Server not responding. The Supabase project may be paused (Restore it in the dashboard), or your browser is blocking the connection.':error.message);
      err.style.display='block';return;
    }
    window._showingLogin=true;
    loadProfileAndEnter(data.user);
  });
}

function doReg(){
  const n=document.getElementById('rn').value.trim(),e=document.getElementById('re').value.trim(),p=document.getElementById('rp').value,err=document.getElementById('rerr');
  err.style.display='none';
  if(!n){err.textContent='Enter your name';err.style.display='block';return}
  if(!e.includes('@')){err.textContent='Enter a valid email';err.style.display='block';return}
  if(p.length<6){err.textContent='Password must be at least 6 characters';err.style.display='block';return}

  const btn=document.querySelector('button[onclick="doReg()"]');
  const origText=btn.textContent;
  btn.textContent='Creating account...';btn.disabled=true;

  sb.auth.signUp({email:e,password:p,options:{data:{name:n}}}).then(({data,error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){
      err.textContent=error.message.includes('already registered')?'An account with this email already exists. Sign in instead.':(error.message.includes('fetch')?'📡 Server not responding. The Supabase project may be paused (Restore it in the dashboard), or your browser is blocking the connection.':error.message);
      err.style.display='block';return;
    }
    if(!data.session){
      // Email confirmation required (shouldn't happen since we disabled it, but just in case)
      err.textContent='Check your email to confirm your registration.';
      err.style.display='block';err.style.color='#22c55e';return;
    }
    window._showingLogin=true;
    loadProfileAndEnter(data.user);
  });
}

// ── Načte profil z `profiles` tabulky a přepne na hlavní app ──
function loadProfileAndEnter(authUser){
  sb.from('profiles').select('*').eq('id',authUser.id).single().then(({data:profile,error})=>{
    if(error||!profile){
      console.error('Profile load error:',error);
      showLogin();
      const err=document.getElementById('lerr')||document.getElementById('rerr');
      if(err){err.textContent="Couldn't load your profile. Please try again.";err.style.display='block'}
      return;
    }
    if(profile.edited_status==='banned'){
      sb.auth.signOut();
      showLogin();
      setTimeout(()=>{
        const err=document.getElementById('lerr');
        if(err){err.textContent='Your account has been blocked by an administrator.';err.style.display='block'}
      },100);
      return;
    }
    user={
      id:authUser.id,
      name:profile.edited_name||authUser.email.split('@')[0],
      email:authUser.email,
      role:profile.edited_role,
      status:profile.edited_status
    };
    // Update last login timestamp
    sb.from('profiles').update({edited_last_login:new Date().toISOString()}).eq('id',authUser.id).then(()=>{});

    // Check if user has chosen device + theme before
    const savedDevice=localStorage.getItem('moon_device');
    const savedTheme=localStorage.getItem('moon_theme')||'dark';
    applyTheme(savedTheme);
    if(savedDevice)applyDevice(savedDevice);

    if(!savedDevice&&window._showingLogin){
      // First time — ask device
      showDevicePicker(()=>{
        showApp();
        setTimeout(()=>confetti(user.role==='admin'?'🛡️ Welcome back, '+user.name+'!':'👋 Welcome, '+user.name+'!',user.role==='admin'?'🛡️':'🎉'),200);

      window._showingLogin=false;
    } else {
      showApp();
      if(window._showingLogin){
        setTimeout(()=>confetti(user.role==='admin'?'🛡️ Welcome back, '+user.name+'!':'👋 Welcome, '+user.name+'!',user.role==='admin'?'🛡️':'🎉'),200);
        window._showingLogin=false;
      }
    }
  });
}

// ── Auto-login from existing Supabase session ──
function tryAutoLogin(){
  // Check if this is a password recovery redirect
  const hash=window.location.hash;
  if(hash.includes('type=recovery')){
    showResetPassword();
    return Promise.resolve(false);
  }
  return sb.auth.getSession().then(({data})=>{
    if(data.session&&data.session.user){
      loadProfileAndEnter(data.session.user);
      return true;
    }
    showLogin();
    return false;
  });
}

// ── Show/hide password field ──
window.togglePw=function(id,btn){
  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}
  else{inp.type='password';btn.textContent='👁️'}
};

// ── Forgot password — send reset email ──
function doForgot(){
  const e=document.getElementById('fe').value.trim();
  const err=document.getElementById('ferr'),ok=document.getElementById('fok');
  err.style.display='none';ok.style.display='none';
  if(!e.includes('@')){err.textContent='Enter a valid email';err.style.display='block';return}

  const btn=document.querySelector('button[onclick="doForgot()"]');
  const origText=btn.textContent;
  btn.textContent='Sending...';btn.disabled=true;

  sb.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin+window.location.pathname}).then(({error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){err.textContent=error.message;err.style.display='block';return}
    ok.textContent='✅ Password reset link sent to '+e+'. Check your inbox (and spam).';
    ok.style.display='block';
  });
}

window.doResetPassword=function(){
  const p=document.getElementById('newpw').value;
  const err=document.getElementById('rpwerr');
  err.style.display='none';
  if(p.length<6){err.textContent='Password must be at least 6 characters';err.style.display='block';return}

  const btn=document.querySelector('button[onclick="doResetPassword()"]');
  const origText=btn.textContent;
  btn.textContent='Saving...';btn.disabled=true;

  sb.auth.updateUser({password:p}).then(({data,error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){err.textContent=error.message;err.style.display='block';return}
    // Clear the recovery hash and proceed to app
    window.location.hash='';
    window._showingLogin=true;
    loadProfileAndEnter(data.user);
    setTimeout(()=>confetti('✅ Password changed!','🔑'),200);
  });
};

  window.startExport=function(){
    _exporting=true;
    document.getElementById('exportBtns').style.display='none';
    document.getElementById('exportProgress').style.display='block';
    const bar=document.getElementById('exportBar');
    const status=document.getElementById('exportStatus');

    // Calculate total duration
    const totalDur=segs.reduce((s,seg)=>s+(seg.end-seg.start),0);
    status.textContent='Recording 0:00 / '+fmt(totalDur)+'...';

    // Start from first segment
    loadSeg(0,true);
    vid.currentTime=segs[0].start;

    // Mix video + music audio streams via Web Audio API
    const actx=new(window.AudioContext||window.webkitAudioContext)();
    const dest=actx.createMediaStreamDestination();
    // Video audio source
    const vidSrc=actx.createMediaElementSource(vid);
    vidSrc.connect(dest);vidSrc.connect(actx.destination);
    // Music audio sources
    const muSrcs=[];
    mTr.forEach(t=>{
      if(!t.audio.paused||true){
        try{
          const s=actx.createMediaElementSource(t.audio);
          s.connect(dest);s.connect(actx.destination);
          muSrcs.push(s);
          t.audio.currentTime=0;
          t.audio.play();
        }catch(e){/* already connected */}
      }
    });

    // Combine video track + mixed audio track
    const vidStream=vid.captureStream();
    const videoTrack=vidStream.getVideoTracks()[0];
    const combinedStream=new MediaStream();
    if(videoTrack)combinedStream.addTrack(videoTrack);
    dest.stream.getAudioTracks().forEach(t=>combinedStream.addTrack(t));

    const chunks=[];
    const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
    const rec=new MediaRecorder(combinedStream,{mimeType:mime,videoBitsPerSecond:5000000});
    rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
    rec.onstop=()=>{
      _exporting=false;
      // Stop music and reconnect audio normally
      mTr.forEach(t=>t.audio.pause());
      try{actx.close()}catch(e){}
      const blob=new Blob(chunks,{type:mime});
      const url=URL.createObjectURL(blob);
      const done=document.getElementById('exportDone');
      bar.style.width='100%';
      status.textContent='✅ Done! '+fmt(totalDur)+' recorded';
      if(done){
        done.style.display='block';
        done.innerHTML=`
          <a href="${url}" download="moon-video.webm" style="display:block;padding:14px;border-radius:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:14px;font-weight:800;text-decoration:none;text-align:center;box-shadow:0 4px 16px rgba(34,197,94,.35);margin-bottom:8px">⬇ Download video (.webm)</a>

      const elapsed=segs.slice(0,curSegIdx).reduce((s,seg)=>s+(seg.end-seg.start),0)+(vid.currentTime-(segs[curSegIdx]?.start||0));
      const pct=Math.min(100,(elapsed/totalDur)*100);
      bar.style.width=pct+'%';
      status.textContent='Recording '+fmt(elapsed)+' / '+fmt(totalDur)+'...';
    },250);

    // Override the end-of-all-segments behavior temporarily

    function onAllDone(){
      clearInterval(progressInterval);

      vid.onended=origOnEnd;

      if(!_exporting)return;

        vid.pause();
        vid.removeEventListener('timeupdate',checkEnd);
        setTimeout(onAllDone,200);
      }
    };

    rec.start();
    vid.play();

      ].map(s=>`
        <div class="g" style="border-radius:18px;padding:18px;position:relative;overflow:hidden">
          <div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,${s.c}18,transparent 70%);pointer-events:none"></div>
          <div style="font-size:26px;margin-bottom:8px">${s.i}</div>
          <div style="font-size:26px;font-weight:900;color:${s.c};margin-bottom:3px">${s.v}</div>
          <div style="font-size:12px;font-weight:700;color:#dcdce2;margin-bottom:6px">${s.l}</div>
          <div style="font-size:10px;color:#bbb;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.detail}">${s.detail||'—'}</div>
          ${s.btn}
        </div>`).join('');}
    }

    window.banUsr=function(id){
      const a=allProfiles.find(x=>x.id===id);
      if(!a)return;
      const newStatus=a.edited_status==='banned'?'approved':'banned';
      sb.from('profiles').update({edited_status:newStatus}).eq('id',id).then(({error})=>{
        if(error){alert('Error: '+error.message);return}
        a.edited_status=newStatus;
        renderAdmin();
        confetti(newStatus==='banned'?'⛔ User banned':'✅ User unbanned',newStatus==='banned'?'⛔':'✅');
      });
    };
    window.delUsr=function(id){
      const a=allProfiles.find(x=>x.id===id);
      if(!a)return;
      const name=a.edited_name||a.email;
      if(!confirm('⚠️ DELETE ACCOUNT PERMANENTLY?\n\nUser: '+name+' ('+a.email+')\n\nWARNING: This account is shared between Moon and LIFA — deleting it removes access to BOTH apps. This action is IRREVERSIBLE.'))return;
      if(!confirm('Are you sure? Last chance — the account "'+name+'" will be deleted forever.'))return;
      sb.rpc('delete_user_edited',{target_id:id}).then(({error})=>{
        if(error){alert('Error: '+error.message);return}
        allProfiles=allProfiles.filter(x=>x.id!==id);
        renderAdmin();
        confetti('🗑️ Account deleted','🗑️');
      });
    };
    window.mkAdmin=function(id){
      const a=allProfiles.find(x=>x.id===id);
      if(!a)return;
      const makeAdmin=a.edited_role!=='admin';
      const name=a.edited_name||a.email;
      if(!confirm(makeAdmin?('Promote "'+name+'" to admin? They will see the admin panel and manage users.'):('Remove admin rights from "'+name+'"?')))return;
      sb.from('profiles').update({edited_role:makeAdmin?'admin':'user'}).eq('id',id).then(({error})=>{
        if(error){alert('Error: '+error.message);return}
        a.edited_role=makeAdmin?'admin':'user';
        renderAdmin();
        confetti(makeAdmin?'👑 '+name+' is now an admin!':'Admin rights removed','👑');
      });
    };
    updAdmin();
  }
  renderCl();
} // end showApp

// ═══ NAV ═══
function nav(id){['Home','Editor','Ai','Admin'].forEach(v=>{const el=document.getElementById('v'+v);if(el)el.style.display='none'});
  const el=document.getElementById('v'+id.charAt(0).toUpperCase()+id.slice(1));if(!el)return;
  if(id==='editor'){el.style.display='flex';el.style.flexDirection='column'}
  else if(id==='ai'){el.style.display='flex';el.style.flexDirection='column'}
  else{el.style.display='block'}
  ['nH','nE','nA','nAd'].forEach(n=>{const b=document.getElementById(n);if(b)b.classList.remove('on')});
  const map={home:'nH',editor:'nE',ai:'nA',admin:'nAd'};const nb=document.getElementById(map[id]);if(nb)nb.classList.add('on')}
window.nav=nav;

function dlApp(){const a=document.createElement('a');a.href='data:text/html;charset=utf-8,'+encodeURIComponent('<!DOCTYPE html>'+document.documentElement.outerHTML);a.download='moon.html';a.click();}
window.dlApp=dlApp;

// ═══ START APP ═══
// Force dark theme immediately on page load
(function(){
  var t=localStorage.getItem('moon_theme');
  if(!t||t==='light'){localStorage.setItem('moon_theme','dark');t='dark'}
  document.body.classList.remove('theme-light');
  document.body.classList.add('theme-dark');
})();

function showConnError(detail){
  R.style.cssText='height:100vh;display:flex;align-items:center;justify-content:center';
  R.innerHTML=`<div class="g" style="padding:36px 32px;border-radius:28px;width:420px;max-width:94vw;text-align:center;animation:fadeUp .5s ease">
    <div style="font-size:48px;margin-bottom:14px">📡</div>
    <h2 style="font-size:20px;font-weight:800;color:#f2f2f5;margin-bottom:8px">Can't connect</h2>
    <p style="font-size:13px;color:#8f8f98;line-height:1.6;margin-bottom:6px">${detail}</p>
    <p style="font-size:11px;color:#bbb;line-height:1.6;margin-bottom:18px">Check your internet connection and disable ad-block / Tracking Prevention for this site. The app doesn't work inside chat previews — open it at edited-video.vercel.app (Moon).</p>
    <button onclick="location.reload()" class="btnprimary" style="width:auto;padding:12px 28px">🔄 Try again</button>
  </div>`;
}

if(!sb){
  showConnError("Couldn't load the connection library (CDN).");
} else {
  tryAutoLogin().catch(err=>{
    console.error('Startup error:',err);
    showConnError('Connection to the server failed ("Failed to fetch").');
  });
}
</script>
