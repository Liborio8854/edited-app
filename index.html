<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edited – Video Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',-apple-system,sans-serif;color:#1a1a2e;height:100vh;overflow:hidden;
  background:linear-gradient(140deg,#fce4ec 0%,#e8d5f5 15%,#c8e6ff 30%,#d4f5e9 45%,#fff3cd 60%,#ffd6e0 75%,#d0d4ff 90%)}
.g{background:rgba(255,255,255,.5);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 2px 20px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.7)}
.b{background:rgba(255,255,255,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);padding:7px 14px;border-radius:12px;
  cursor:pointer;font-size:12px;font-family:inherit;color:#555;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.b:hover{background:rgba(255,255,255,.7);transform:translateY(-1px)}
.b.on{background:rgba(255,255,255,.75);color:#1a1a2e;font-weight:600}
.b.ac{background:linear-gradient(135deg,rgba(232,62,90,.12),rgba(255,138,92,.1));border:1px solid rgba(232,62,90,.25);color:#e83e5a;font-weight:700}
.inp{width:100%;background:rgba(255,255,255,.45);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.5);border-radius:14px;
  padding:14px 18px;font-size:14px;color:#333;font-family:inherit;outline:0}
.inp:focus{border-color:rgba(232,62,90,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,15px) scale(1.04)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ADMIN_EMAIL='eduard.falta@gmail.com';
const R=document.getElementById('root');
let user=null, adminUsers=[], clipIdCounter=1;

// ═══ LOGIN ═══
function showLogin(mode){
  mode=mode||'welcome';
  R.style.cssText='height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden';
  let h=`<div style="position:absolute;top:-10%;right:-5%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(232,62,90,.12),transparent 70%);pointer-events:none;animation:drift 12s ease-in-out infinite"></div>
  <div style="position:absolute;bottom:-15%;left:-8%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.08),transparent 70%);pointer-events:none;animation:drift 15s ease-in-out infinite 3s"></div>
  <div class="g" style="padding:40px 36px;border-radius:28px;width:420px;max-width:92vw;position:relative;z-index:2;animation:fadeUp .6s ease">
  <div style="position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:28px 28px 0 0;pointer-events:none"></div>
  <div style="text-align:center;margin-bottom:28px;position:relative">
    <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#e83e5a,#ff8a5c);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:800;margin:0 auto 14px;box-shadow:0 6px 24px rgba(232,62,90,.25)">▸</div>
    <h1 style="font-size:32px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,#1a1a2e,#5a4a8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Edited</h1>
    <p style="font-size:13px;color:#999">Kreativní video editor</p>
  </div>`;

  if(mode==='welcome'){
    h+=`<div style="display:flex;flex-direction:column;gap:10px;position:relative">
      <button class="b" onclick="doOAuth('google')" style="width:100%;border-radius:14px;padding:14px 18px;font-size:14px;font-weight:500;color:#333;justify-content:flex-start;gap:12px">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Pokračovat přes Google</button>
      <button class="b" onclick="doOAuth('apple')" style="width:100%;border-radius:14px;padding:14px 18px;font-size:14px;font-weight:500;color:#333;justify-content:flex-start;gap:12px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#333"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C3.79 16.17 4.36 9.53 8.7 9.28c1.23.06 2.08.72 2.8.75.95-.2 1.87-.88 2.9-.8 1.23.1 2.16.6 2.77 1.52-2.55 1.52-1.95 4.87.52 5.8-.43 1.14-.99 2.27-1.64 3.73zM12.03 9.2c-.13-2.15 1.57-4 3.64-4.17.27 2.4-2.16 4.37-3.64 4.17z"/></svg>
        Pokračovat přes Apple</button>
      <button class="b" onclick="doOAuth('facebook')" style="width:100%;border-radius:14px;padding:14px 18px;font-size:14px;font-weight:500;color:#333;justify-content:flex-start;gap:12px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Pokračovat přes Facebook</button>
      <div style="display:flex;align-items:center;gap:12px;margin:6px 0"><div style="flex:1;height:1px;background:rgba(0,0,0,.08)"></div><span style="font-size:11px;color:#bbb">nebo</span><div style="flex:1;height:1px;background:rgba(0,0,0,.08)"></div></div>
      <button class="b" onclick="showLogin('email')" style="width:100%;border-radius:14px;padding:14px 18px;font-size:14px;color:#555;justify-content:flex-start;gap:12px">✉️ Přihlásit se emailem</button>
      <div style="text-align:center;margin-top:4px"><span style="font-size:12px;color:#aaa">Nemáš účet? </span><button onclick="showLogin('register')" style="background:0;border:0;color:#e83e5a;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Zaregistruj se</button></div>
    </div>`;
  } else if(mode==='email'){
    h+=`<div style="display:flex;flex-direction:column;gap:12px"><input class="inp" id="le" placeholder="Email" type="email"><input class="inp" id="lp" placeholder="Heslo" type="password" onkeydown="if(event.key==='Enter')doEmail()"><div id="lerr" style="font-size:12px;color:#e83e5a;display:none"></div><button onclick="doEmail()" style="width:100%;border-radius:14px;padding:14px;font-size:14px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,#e83e5a,#ff8a5c);border:none;cursor:pointer">Přihlásit se</button><button onclick="showLogin()" style="background:0;border:0;color:#aaa;font-size:12px;cursor:pointer;font-family:inherit">← Zpět</button></div>`;
  } else {
    h+=`<div style="display:flex;flex-direction:column;gap:12px"><input class="inp" id="rn" placeholder="Jméno"><input class="inp" id="re" placeholder="Email" type="email"><input class="inp" id="rp" placeholder="Heslo" type="password" onkeydown="if(event.key==='Enter')doReg()"><div id="rerr" style="font-size:12px;color:#e83e5a;display:none"></div><button onclick="doReg()" style="width:100%;border-radius:14px;padding:14px;font-size:14px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,#e83e5a,#ff8a5c);border:none;cursor:pointer">Vytvořit účet</button><button onclick="showLogin()" style="background:0;border:0;color:#aaa;font-size:12px;cursor:pointer;font-family:inherit">← Zpět</button></div>`;
  }
  h+=`<div style="text-align:center;margin-top:20px;font-size:10px;color:#c0c0c0">Přihlášením souhlasíš s <span style="color:#999">Podmínkami</span> a <span style="color:#999">Ochranou údajů</span></div></div>`;
  R.innerHTML=h;
}

function doOAuth(p){login({name:p==='google'?'Eduard':'Uživatel',email:p==='google'?'Eduard.Falta@gmail.com':'user@'+p+'.com',method:p})}
function doEmail(){const e=document.getElementById('le').value,p=document.getElementById('lp').value,err=document.getElementById('lerr');if(!e.includes('@')){err.textContent='Zadej platný email';err.style.display='block';return}if(p.length<4){err.textContent='Min. 4 znaky';err.style.display='block';return}login({name:e.split('@')[0],email:e,method:'email'})}
function doReg(){const n=document.getElementById('rn').value,e=document.getElementById('re').value,p=document.getElementById('rp').value,err=document.getElementById('rerr');if(!n.trim()){err.textContent='Zadej jméno';err.style.display='block';return}if(!e.includes('@')){err.textContent='Zadej platný email';err.style.display='block';return}if(p.length<4){err.textContent='Min. 4 znaky';err.style.display='block';return}login({name:n,email:e,method:'email'})}
function login(u){u.role=u.email.toLowerCase()===ADMIN_EMAIL?'admin':'user';user=u;adminUsers=[{id:1,n:u.name,e:u.email,r:u.role,s:'online',last:'Právě teď',vids:0,joined:new Date().toLocaleDateString('cs')}];showApp()}

// ═══ HELPERS ═══
function fmt(s){return!s||isNaN(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function ytIdFromUrl(url){const m=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}

// ═══ MAIN APP ═══
function showApp(){
  const A=user.role==='admin';
  R.style.cssText='height:100vh;display:flex;flex-direction:column;overflow:hidden';
  R.innerHTML=`
  <div class="g" style="height:52px;display:flex;align-items:center;padding:0 16px;gap:6px;border-bottom:1px solid rgba(255,255,255,.5);flex-shrink:0;z-index:50;position:relative;border-radius:0;border-top:0;border-left:0;border-right:0">
    <div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#e83e5a,#ff8a5c);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800;box-shadow:0 2px 8px rgba(232,62,90,.3)">▸</div><span style="font-weight:700;font-size:17px;background:linear-gradient(135deg,#1a1a2e,#4a4a6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Edited</span>${A?'<span style="font-size:8px;font-weight:700;color:#e83e5a;background:rgba(232,62,90,.08);padding:2px 6px;border-radius:5px">ADMIN</span>':''}</div>
    <div style="flex:1"></div>
    <button class="b on" id="nH" onclick="nav('home')">🏠 Domů</button>
    <button class="b" id="nE" onclick="nav('editor')">✂️ Editor</button>
    <button class="b" id="nA" onclick="nav('ai')">✨ AI</button>
    ${A?'<button class="b" id="nAd" onclick="nav(\'admin\')" style="color:#e83e5a;font-weight:600">🛡️ Admin</button>':''}
    <div style="width:1px;height:22px;background:rgba(0,0,0,.06);margin:0 2px"></div>
    <input type="file" id="fi" accept="video/*,.mkv,.avi,.mov,.mp4,.webm,.m4v" style="display:none">
    <button class="b ac" onclick="document.getElementById('fi').click()">+ Video</button>
    <div style="position:relative"><button class="b" onclick="document.getElementById('pdd').style.display=document.getElementById('pdd').style.display==='none'?'block':'none'" style="border-radius:50%;width:32px;height:32px;padding:0;justify-content:center;font-size:13px;font-weight:700;color:${A?'#fff':'#e83e5a'};${A?'background:linear-gradient(135deg,#e83e5a,#ff8a5c);border:none':''}">${user.name[0].toUpperCase()}</button>
      <div id="pdd" class="g" style="display:none;position:absolute;top:40px;right:0;border-radius:16px;padding:16px;width:240px;z-index:100;animation:fadeUp .2s">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(0,0,0,.06)">
          <div style="width:36px;height:36px;border-radius:10px;background:${A?'linear-gradient(135deg,#e83e5a,#ff8a5c)':'linear-gradient(135deg,#ddd,#ccc)'};display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700">${user.name[0].toUpperCase()}</div>
          <div><div style="font-size:13px;font-weight:600;color:#222">${user.name} ${A?'<span style="font-size:7px;font-weight:800;color:#fff;background:linear-gradient(135deg,#e83e5a,#ff8a5c);padding:1px 5px;border-radius:4px;vertical-align:middle">ADMIN</span>':''}</div><div style="font-size:10px;color:#aaa">${user.email}</div></div>
        </div>
        <button class="b" onclick="user=null;showLogin()" style="width:100%;justify-content:center;color:#999">Odhlásit se</button>
      </div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">

    <!-- HOME -->
    <div id="vHome" style="flex:1;overflow:auto;padding:28px 36px">
      <h1 style="font-size:28px;font-weight:800;background:linear-gradient(135deg,#1a1a2e,#5a4a8a,#e83e5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Ahoj, ${user.name} 👋</h1>
      <p style="font-size:13px;color:#888;margin-top:4px" id="homeSubtitle">Nahraj video a začni tvořit</p>
      <div style="display:flex;gap:12px;margin:20px 0;flex-wrap:wrap">
        <button class="b" onclick="document.getElementById('fi').click()" style="padding:14px 22px;font-size:13px;border-radius:16px">📂 Nahrát video</button>
        <button class="b" onclick="nav('editor');setTimeout(()=>showTab('yt'),50)" style="padding:14px 22px;font-size:13px;border-radius:16px">▶ YouTube</button>
        <button class="b" onclick="nav('ai')" style="padding:14px 22px;font-size:13px;border-radius:16px">✨ AI Studio</button>
        ${A?'<button class="b" onclick="nav(\'admin\')" style="padding:14px 22px;font-size:13px;border-radius:16px">🛡️ Admin</button>':''}
      </div>
      <div id="homeProjects"></div>
    </div>

    <!-- EDITOR -->
    <div id="vEditor" style="display:none;flex:1;flex-direction:row;overflow:hidden">
      <div class="g" style="width:280px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;border-radius:0;border-top:0;border-bottom:0;border-left:0">
        <div style="display:flex;border-bottom:1px solid rgba(0,0,0,.05);flex-shrink:0" id="stabs">
          <button class="on" onclick="showTab('media')" style="flex:1;padding:10px 4px;border:none;border-bottom:2px solid #e83e5a;background:rgba(255,255,255,.4);cursor:pointer;font-size:9px;font-family:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#e83e5a;display:flex;flex-direction:column;align-items:center;gap:2px" data-tab="media"><span style="font-size:15px">📁</span>Média</button>
          <button onclick="showTab('yt')" style="flex:1;padding:10px 4px;border:none;border-bottom:2px solid transparent;background:0;cursor:pointer;font-size:9px;font-family:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px" data-tab="yt"><span style="font-size:15px">▶</span>YouTube</button>
          <button onclick="showTab('mu')" style="flex:1;padding:10px 4px;border:none;border-bottom:2px solid transparent;background:0;cursor:pointer;font-size:9px;font-family:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px" data-tab="mu"><span style="font-size:15px">🎵</span>Hudba</button>
        </div>
        <div style="flex:1;overflow:auto;padding:14px">
          <div id="pMedia">
            <button class="b ac" onclick="document.getElementById('fi').click()" style="width:100%;justify-content:center;padding:12px;border-radius:14px;margin-bottom:12px">📂 Nahrát video</button>
            <div id="cl"></div>
          </div>
          <div id="pYt" style="display:none">
            <div style="display:flex;gap:6px;margin-bottom:10px">
              <input class="inp" id="ytq" placeholder="Hledej na YouTube..." style="padding:10px 14px;font-size:12px;border-radius:12px">
              <button class="b ac" onclick="var q=document.getElementById('ytq').value;if(q)window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')" style="border-radius:12px;font-size:13px;flex-shrink:0">🔍</button>
            </div>
            <div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px">Přidat video z URL</div>
            <input class="inp" id="yturl" placeholder="Vlož YouTube URL..." style="padding:10px 14px;font-size:12px;border-radius:12px;margin-bottom:8px">
            <button class="b ac" onclick="addYtUrl()" style="width:100%;justify-content:center;border-radius:12px;padding:10px">➕ Přidat do editu</button>
            <div id="ytClips" style="margin-top:12px"></div>
            <div style="text-align:center;padding:20px;color:#ccc;margin-top:8px">
              <div style="font-size:11px;color:#aaa;line-height:1.6">1. Hledej na YouTube tlačítkem 🔍<br>2. Zkopíruj URL videa<br>3. Vlož sem a klikni Přidat</div>
            </div>
          </div>
          <div id="pMu" style="display:none">
            <input type="file" id="mi" accept="audio/*" style="display:none">
            <button class="b" onclick="document.getElementById('mi').click()" style="width:100%;justify-content:center;padding:12px;border-radius:14px;color:#8b5cf6;margin-bottom:12px">🎵 Přidat MP3</button>
            <div id="ml"><div style="text-align:center;padding:30px;color:#ccc"><div style="font-size:36px;margin-bottom:8px">🎵</div><div style="font-size:12px;color:#aaa">Nahraj audio podkres</div></div></div>
          </div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;margin:10px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.03);position:relative;min-height:200px;overflow:hidden" id="pa">
          <video id="vid" controls playsinline preload="metadata" style="display:none;max-width:98%;max-height:98%;border-radius:12px;background:#000"></video>
          <iframe id="ytframe" style="display:none;width:94%;height:94%;border:none;border-radius:14px" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
          <div id="es" style="text-align:center"><div style="font-size:56px;margin-bottom:14px;animation:float 3s ease infinite">🎬</div><p style="font-size:14px;font-weight:600;color:#aaa">Nahraj video nebo přidej z YouTube</p></div>
        </div>
        <div id="tr" style="display:none;padding:6px 14px;align-items:center;gap:5px;flex-wrap:wrap;flex-shrink:0">
          <button class="b" onclick="vid.currentTime=Math.max(0,vid.currentTime-5)">−5s</button>
          <button class="b ac" onclick="vid.paused?vid.play():vid.pause()" id="pb" style="width:36px;justify-content:center;font-size:14px">▶</button>
          <button class="b" onclick="vid.currentTime=Math.min(vid.duration||0,vid.currentTime+5)">+5s</button>
          <div style="width:1px;height:20px;background:rgba(0,0,0,.06);margin:0 3px"></div>
          <button class="b" onclick="addCut()" style="color:#e83e5a">✂️ Střih</button>
          <div style="flex:1"></div>
          <span id="td" style="font-size:12px;color:#aaa;font-weight:500">0:00 / 0:00</span>
          <button class="b" onclick="vid.muted=!vid.muted;this.textContent=vid.muted?'🔇':'🔊'" style="padding:5px 8px">🔊</button>
          <input type="range" min="0" max="100" value="80" oninput="vid.volume=this.value/100" style="width:50px;accent-color:#e83e5a;height:3px">
        </div>
        <div id="tla" class="g" style="display:none;height:75px;border-radius:0;border-left:0;border-right:0;border-bottom:0;flex-shrink:0;flex-direction:column;padding:5px 12px">
          <div class="g" style="flex:1;border-radius:10px;position:relative;cursor:crosshair" onclick="var r=this.getBoundingClientRect();vid.currentTime=Math.max(0,Math.min(1,(event.clientX-r.left)/r.width))*(vid.duration||0)">
            <div id="trm" style="position:absolute;top:0;height:100%;border-top:2px solid rgba(232,62,90,.5);border-bottom:2px solid rgba(232,62,90,.5);background:rgba(232,62,90,.06)"></div>
