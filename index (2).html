<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edited – Video Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --red:#e83e5a; --orange:#ff7a3d; --purple:#8b5cf6; --blue:#38bdf8;
  --green:#22c55e; --pink:#f472b6; --yellow:#f59e0b;
  --bg1:#fce4ec; --bg2:#e8d5f5; --bg3:#c8e6ff; --bg4:#d4f5e9;
}

body{
  font-family:'Outfit',-apple-system,sans-serif;color:#1a1a2e;height:100vh;overflow:hidden;
  background:linear-gradient(145deg,#fce4ec 0%,#ede0ff 20%,#c8e6ff 40%,#d4f5e9 60%,#fff3cd 80%,#ffd6e0 100%);
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}

/* Glass */
.g{
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 4px 24px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(0,0,0,.02);
}

/* Buttons */
.b{
  background:rgba(255,255,255,.48);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.55);padding:8px 16px;border-radius:14px;
  cursor:pointer;font-size:12px;font-family:inherit;color:#444;font-weight:500;
  transition:all .2s cubic-bezier(.4,0,.2,1);display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.b:hover{background:rgba(255,255,255,.75);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);color:#1a1a2e}
.b:active{transform:translateY(0)}
.b.on{background:rgba(255,255,255,.8);color:#1a1a2e;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.08)}

/* Accent buttons with gradient */
.b.ac{background:linear-gradient(135deg,rgba(232,62,90,.14),rgba(255,122,61,.1));border:1px solid rgba(232,62,90,.3);color:var(--red);font-weight:700}
.b.ac:hover{background:linear-gradient(135deg,rgba(232,62,90,.22),rgba(255,122,61,.16));box-shadow:0 6px 20px rgba(232,62,90,.15)}

/* Primary button */
.btnprimary{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--red),var(--orange));
  box-shadow:0 4px 20px rgba(232,62,90,.3);transition:all .2s;
  border-radius:14px;padding:14px;font-size:14px;width:100%;
}
.btnprimary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,62,90,.4)}
.btnprimary:active{transform:translateY(0)}

/* Inputs */
.inp{
  width:100%;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,255,255,.6);border-radius:14px;
  padding:13px 18px;font-size:14px;color:#333;font-family:inherit;outline:0;
  transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.inp:focus{border-color:rgba(232,62,90,.5);background:rgba(255,255,255,.75);box-shadow:0 4px 16px rgba(232,62,90,.1)}
.inp::placeholder{color:#bbb}

/* Colored section headers */
.sh{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;padding:0 2px;margin-bottom:8px}

/* Cards */
.card{border-radius:20px;transition:all .25s cubic-bezier(.4,0,.2,1)}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.1)!important}

/* Nav tabs */
.ntab{
  flex:1;padding:10px 4px;border:none;border-bottom:2.5px solid transparent;
  background:transparent;cursor:pointer;font-size:9px;font-family:inherit;
  font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#aaa;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;
}
.ntab:hover{color:#888;background:rgba(255,255,255,.3)}
.ntab.on{border-bottom-color:var(--red);color:var(--red);background:rgba(232,62,90,.05)}
.ntab .ti{font-size:18px}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge.green{background:rgba(34,197,94,.12);color:#16a34a}
.badge.red{background:rgba(239,68,68,.12);color:#dc2626}
.badge.orange{background:rgba(245,158,11,.12);color:#d97706}
.badge.purple{background:rgba(139,92,246,.12);color:#7c3aed}
.badge.gray{background:rgba(0,0,0,.06);color:#777}

/* Timeline */
.ph{position:absolute;top:-6px;width:3px;height:calc(100% + 12px);background:linear-gradient(180deg,var(--red),rgba(232,62,90,.3));z-index:5;pointer-events:none;border-radius:2px}
.ph::before{content:'';position:absolute;top:0;left:-4px;width:11px;height:11px;background:var(--red);border-radius:50%;box-shadow:0 0 0 3px rgba(232,62,90,.2)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:10px}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,18px) scale(1.05)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* Colorful blob backgrounds */
.blob{position:absolute;border-radius:50%;pointer-events:none;filter:blur(0px)}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Toast notification */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);z-index:9998;padding:12px 24px;border-radius:20px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#1a1a2e,#3a2a5e);box-shadow:0 8px 32px rgba(0,0,0,.2);transition:transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Robot animation */
@keyframes robotBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes robotEye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes robotGlow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══════════════════════════════════════
   MOBILE RESPONSIVE
   ═══════════════════════════════════════ */
@media (max-width: 768px){
  body{overflow:auto}

  /* Prevent iOS auto-zoom on input focus */
  input,select,textarea{font-size:16px !important}

  /* Topbar: hide button text labels, keep icons only */
  .topbar-label{display:none !important}
  .mob-hide{display:none !important}

  /* Editor: sidebar becomes a bottom sheet / collapsible drawer */
  #vEditor{flex-direction:column !important}
  #editorSidebar{
    width:100% !important;
    height:auto !important;
    max-height:42vh;
    border-right:0 !important;
    border-top:1px solid rgba(255,255,255,.5);
    order:2;
  }
  .editor-main-mobile{order:1}

  /* AI Studio: smaller robot, stack header */
  #vAi{padding:0 12px !important}
  .ai-hero-row{flex-direction:column;gap:10px !important;text-align:center}
  .ai-hero-row > div:last-child{text-align:center !important;max-width:100% !important}

  /* Admin: stat grid fewer columns, smaller padding */
  #vAdmin > div:first-child{padding:18px 16px !important}
  #vAdmin .admin-content-pad{padding:16px !important}
  #adminStats{grid-template-columns:repeat(2,1fr) !important}
  #adminTabs button{font-size:8px !important;padding:8px 2px !important}
  #adminTabs .ti{font-size:14px !important}

  /* Home: single column quick actions on very small screens */
  #vHome{padding:0 !important}
  .home-hero{padding:20px 16px !important}
  .home-actions{grid-template-columns:repeat(2,1fr) !important;padding:0 16px !important}
  .home-section-pad{padding:0 16px !important}

  /* Login card: full width with margin */
  .login-card{width:94vw !important;padding:24px 20px !important}

  /* Transport bar: allow wrap, smaller gaps */
  #tr{padding:6px 8px !important;gap:5px !important}

  /* Profile dropdown: ensure it doesn't overflow screen */
  #pdd{right:0 !important;width:220px !important}
}

@media (max-width: 480px){
  /* Extra small phones */
  .home-actions{grid-template-columns:1fr 1fr !important}
  #adminStats{grid-template-columns:1fr 1fr !important}
  .btn-text-sm{display:none !important}
}
</style>

// ═══ CONFETTI & TOAST ═══
function confetti(msg, icon){
  // Toast
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=(icon||'🎉')+' '+msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{t.classList.add('show')})});
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),500)},3000);

  // Confetti particles
  const colors=['#e83e5a','#ff7a3d','#8b5cf6','#38bdf8','#22c55e','#f472b6','#f59e0b','#ffffff'];
  const shapes=['▶','★','♪','✦','●','■','▲','♥'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;pointer-events:none;z-index:9999;
      left:${Math.random()*100}vw;
      top:-20px;
      width:${6+Math.random()*10}px;
      height:${6+Math.random()*10}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random()>.5?'50%':'2px'};
      animation:confettiFall ${1.5+Math.random()*2}s ${Math.random()*.8}s linear forwards;
      transform-origin:center;`;
    if(Math.random()>.7){el.style.background='transparent';el.style.fontSize=(8+Math.random()*12)+'px';el.style.color=colors[Math.floor(Math.random()*colors.length)];el.textContent=shapes[Math.floor(Math.random()*shapes.length)];el.style.width='auto';el.style.height='auto';el.style.borderRadius='0'}
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}

  for(let i=0;i<12;i++){
    const e=document.createElement('div');
    const angle=(i/12)*360;
    const dist=80+Math.random()*60;
    const dx=Math.cos(angle*Math.PI/180)*dist;
    const dy=Math.sin(angle*Math.PI/180)*dist;
    e.style.cssText=`position:fixed;top:50%;left:50%;font-size:${20+Math.random()*16}px;animation:emojiBurst 1s ease-out ${Math.random()*0.3}s forwards;transform:translate(-50%,-50%);--dx:${dx}px;--dy:${dy}px`;
    e.textContent=emoji||'🎬';
    container.appendChild(e);
  }
  // Toast message
  if(msg){
    const toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,.85);backdrop-filter:blur(16px);color:#fff;padding:14px 28px;border-radius:20px;font-size:14px;font-weight:700;font-family:Outfit,sans-serif;z-index:10000;animation:toastAnim 3s ease forwards;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.25)';
    toast.textContent=msg;
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),3000);
  }
  setTimeout(()=>container.remove(),3500);
}

// ─── CSS for confetti animations ───
(function(){
  const s=document.createElement('style');
  s.textContent=`
    @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(var(--r,720deg));opacity:0}}

    @keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(20px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}

// ─── Quick toast (no confetti) ───
function toast(msg,color){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:${color||'rgba(26,26,46,.85)'};backdrop-filter:blur(16px);color:#fff;padding:12px 24px;border-radius:16px;font-size:13px;font-weight:600;font-family:Outfit,sans-serif;z-index:10000;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.2);transition:all .3s`;
  t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>{t.style.transform='translateX(-50%) translateY(0)';t.style.opacity='1'});
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(-10px)';setTimeout(()=>t.remove(),400)},2500);
}

// ═══ SUPABASE AUTH ═══

function doEmail(){
  const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value,err=document.getElementById('lerr');
  err.style.display='none';
  if(!e.includes('@')){err.textContent='Zadej platný email';err.style.display='block';return}
  if(p.length<6){err.textContent='Heslo musí mít min. 6 znaků';err.style.display='block';return}

  const btn=document.querySelector('.btnprimary');
  const origText=btn.textContent;
  btn.textContent='Přihlašuji...';btn.disabled=true;

  sb.auth.signInWithPassword({email:e,password:p}).then(({data,error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){
      err.textContent=error.message==='Invalid login credentials'?'Nesprávný email nebo heslo':(error.message.includes('fetch')?'📡 Server neodpovídá. Projekt v Supabase může být pozastavený (Restore v dashboardu), nebo spojení blokuje prohlížeč.':error.message);
      err.style.display='block';return;
    }
    window._showingLogin=true;
    loadProfileAndEnter(data.user);
  });
}

function doReg(){
  const n=document.getElementById('rn').value.trim(),e=document.getElementById('re').value.trim(),p=document.getElementById('rp').value,err=document.getElementById('rerr');
  err.style.display='none';
  if(!n){err.textContent='Zadej jméno';err.style.display='block';return}
  if(!e.includes('@')){err.textContent='Zadej platný email';err.style.display='block';return}
  if(p.length<6){err.textContent='Heslo musí mít min. 6 znaků';err.style.display='block';return}

  const btn=document.querySelector('button[onclick="doReg()"]');
  const origText=btn.textContent;
  btn.textContent='Vytvářím účet...';btn.disabled=true;

  sb.auth.signUp({email:e,password:p,options:{data:{name:n}}}).then(({data,error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){
      err.textContent=error.message.includes('already registered')?'Účet s tímto emailem už existuje. Přihlas se.':(error.message.includes('fetch')?'📡 Server neodpovídá. Projekt v Supabase může být pozastavený (Restore v dashboardu), nebo spojení blokuje prohlížeč.':error.message);
      err.style.display='block';return;
    }
    if(!data.session){
      // Email confirmation required (shouldn't happen since we disabled it, but just in case)
      err.textContent='Zkontroluj svůj email pro potvrzení registrace.';
      err.style.display='block';err.style.color='#22c55e';return;
    }
    window._showingLogin=true;
    loadProfileAndEnter(data.user);
  });
}

// ── Načte profil z `profiles` tabulky a přepne na hlavní app ──
function loadProfileAndEnter(authUser){
  sb.from('profiles').select('*').eq('id',authUser.id).single().then(({data:profile,error})=>{
    if(error||!profile){
      console.error('Profile load error:',error);
      showLogin();
      const err=document.getElementById('lerr')||document.getElementById('rerr');
      if(err){err.textContent='Nepodařilo se načíst profil. Zkus to znovu.';err.style.display='block'}
      return;
    }
    if(profile.edited_status==='banned'){
      sb.auth.signOut();
      showLogin();
      setTimeout(()=>{
        const err=document.getElementById('lerr');
        if(err){err.textContent='Tvůj účet byl zablokován administrátorem.';err.style.display='block'}
      },100);
      return;
    }
    user={
      id:authUser.id,
      name:profile.edited_name||authUser.email.split('@')[0],
      email:authUser.email,
      role:profile.edited_role,
      status:profile.edited_status
    };
    // Update last login timestamp
    sb.from('profiles').update({edited_last_login:new Date().toISOString()}).eq('id',authUser.id).then(()=>{});
    showApp();
    if(window._showingLogin){
      setTimeout(()=>confetti(user.role==='admin'?'🛡️ Vítej zpět, '+user.name+'!':'👋 Vítej, '+user.name+'!',user.role==='admin'?'🛡️':'🎉'),200);
      window._showingLogin=false;
    }
  });
}

function logout(){
  sb.auth.signOut().then(()=>{
    user=null;
    showLogin();
  });
}

// ── Auto-login from existing Supabase session ──
function tryAutoLogin(){
  // Check if this is a password recovery redirect
  const hash=window.location.hash;
  if(hash.includes('type=recovery')){
    showResetPassword();
    return Promise.resolve(false);
  }
  return sb.auth.getSession().then(({data})=>{
    if(data.session&&data.session.user){
      loadProfileAndEnter(data.session.user);
      return true;
    }
    showLogin();
    return false;
  });
}

// ── Show/hide password field ──

  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}
  else{inp.type='password';btn.textContent='👁️'}
};

// ── Forgot password — send reset email ──
function doForgot(){
  const e=document.getElementById('fe').value.trim();
  const err=document.getElementById('ferr'),ok=document.getElementById('fok');
  err.style.display='none';ok.style.display='none';
  if(!e.includes('@')){err.textContent='Zadej platný email';err.style.display='block';return}

  const btn=document.querySelector('button[onclick="doForgot()"]');
  const origText=btn.textContent;
  btn.textContent='Odesílám...';btn.disabled=true;

  sb.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin+window.location.pathname}).then(({error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){err.textContent=error.message;err.style.display='block';return}
    ok.textContent='✅ Odkaz pro obnovení hesla byl odeslán na '+e+'. Zkontroluj svou schránku (i spam).';
    ok.style.display='block';
  });
}

window.doResetPassword=function(){
  const p=document.getElementById('newpw').value;
  const err=document.getElementById('rpwerr');
  err.style.display='none';
  if(p.length<6){err.textContent='Heslo musí mít min. 6 znaků';err.style.display='block';return}

  const btn=document.querySelector('button[onclick="doResetPassword()"]');
  const origText=btn.textContent;
  btn.textContent='Ukládám...';btn.disabled=true;

  sb.auth.updateUser({password:p}).then(({data,error})=>{
    btn.textContent=origText;btn.disabled=false;
    if(error){err.textContent=error.message;err.style.display='block';return}
    // Clear the recovery hash and proceed to app
    window.location.hash='';
    window._showingLogin=true;
    loadProfileAndEnter(data.user);
    setTimeout(()=>confetti('✅ Heslo bylo změněno!','🔑'),200);
  });
};

  // ── Admin ──
  if(A){
    let allProfiles=[];

    function updAdmin(){
      sb.from('profiles').select('id,email,edited_name,edited_role,edited_status,edited_last_login').then(({data,error})=>{
        if(error){console.error('Admin load error:',error);return}
        allProfiles=data||[];
        renderAdmin();
      });
    }

    function renderAdmin(){
      const allAccounts=allProfiles;
      const active=allAccounts.filter(a=>a.edited_status!=='rejected');
      const banned=allAccounts.filter(a=>a.edited_status==='banned');

      // Stats
      document.getElementById('adminStats').innerHTML=[
        {l:'Uživatelé celkem',v:allAccounts.length,i:'👥',c:'#38bdf8',sub:'registrované účty'},
        {l:'Zabanovaní',v:banned.length,i:'⛔',c:'#ef4444',sub:'blokovaní uživatelé'},
        {l:'Klipy v editu',v:clips.length,i:'🎬',c:'#8b5cf6',sub:'aktuální session'},
        {l:'Střihy',v:cuts.length,i:'✂️',c:'#e83e5a',sub:'v aktuálním projektu'},
        {l:'Audio stopy',v:mTr.length,i:'🎵',c:'#f472b6',sub:'nahraná hudba'},
        {l:'Tvoje role',v:'Admin',i:'🛡️',c:'#22c55e',sub:user.email},
      ].map(s=>`
        <div class="g" style="border-radius:18px;padding:16px;position:relative;overflow:hidden;cursor:default;transition:all .2s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,${s.c}20,transparent 70%);pointer-events:none"></div>
          <div style="font-size:24px;margin-bottom:8px">${s.i}</div>
          <div style="font-size:24px;font-weight:900;color:${s.c};margin-bottom:2px">${s.v}</div>
          <div style="font-size:11px;font-weight:700;color:#444;margin-bottom:2px">${s.l}</div>
          <div style="font-size:9px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.sub}</div>
        </div>`).join('');

      // Activity feed — recent logins
      const feed=document.getElementById('activityFeed');
      if(feed){
        const activities=allAccounts.filter(a=>a.edited_last_login).sort((x,y)=>new Date(y.edited_last_login)-new Date(x.edited_last_login)).slice(0,8).map(a=>({icon:'🔐',color:'#22c55e',text:`<b>${a.edited_name||a.email}</b> se přihlásil`,time:a.edited_last_login,badge:'Přihlášení',bc:'#22c55e'}));

        if(!activities.length){
          feed.innerHTML='<div style="text-align:center;padding:24px;color:#ccc"><div style="font-size:32px;margin-bottom:8px">😴</div><div style="font-size:12px">Zatím žádná aktivita</div></div>';
        } else {
          feed.innerHTML=activities.map((a,i)=>`
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:${i<activities.length-1?'1px solid rgba(0,0,0,.04)':'none'}">
              <div style="width:36px;height:36px;border-radius:12px;background:${a.color}18;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${a.icon}</div>
              <div style="flex:1">
                <div style="font-size:12px;color:#444;line-height:1.4">${a.text}</div>
                <div style="font-size:10px;color:#bbb;margin-top:2px">${new Date(a.time).toLocaleDateString('cs')} ${new Date(a.time).toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'})}</div>
              </div>
              <span style="padding:3px 8px;border-radius:8px;font-size:9px;font-weight:700;background:${a.bc}12;color:${a.bc}">${a.badge}</span>
            </div>`).join('');
        }
      }

      // Pending tab — not used (no pending status), show info message
      const pr=document.getElementById('pendingRows');
      if(pr){
        pr.innerHTML=`<div style="text-align:center;padding:48px;color:#ccc">
          <div style="font-size:48px;margin-bottom:12px">✅</div>
          <div style="font-size:14px;font-weight:700;color:#aaa;margin-bottom:4px">Registrace je automatická</div>
          <div style="font-size:12px;color:#bbb">Noví uživatelé mají přístup ihned po registraci.<br>Zde můžeš případně zpětně zablokovat uživatele v záložce Uživatelé.</div>
        </div>`;
      }

      // Users tab
      document.getElementById('userCount').textContent=allAccounts.length+' uživatelů · '+(allAccounts.length-banned.length)+' aktivních · '+banned.length+' zabanovaných';
      document.getElementById('userRows').innerHTML=active.map(a=>{
        const isMe=a.email.toLowerCase()===user.email.toLowerCase();
        const isAdm=a.edited_role==='admin';
        const isBanned=a.edited_status==='banned';
        const lastLogin=a.edited_last_login?new Date(a.edited_last_login).toLocaleDateString('cs')+' '+new Date(a.edited_last_login).toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'}):'Nikdy';
        const statusC=isBanned?'#ef4444':isMe?'#22c55e':'#aaa';
        const statusT=isBanned?'⛔ Ban':isMe?'● Online':'○ Offline';
        const statusBg=isBanned?'rgba(239,68,68,.08)':isMe?'rgba(34,197,94,.08)':'rgba(0,0,0,.04)';
        const dispName=a.edited_name||a.email.split('@')[0];
        return `<div class="g userRow" style="border-radius:16px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,.7)'" onmouseout="this.style.background=''">
          <div style="width:40px;height:40px;border-radius:13px;background:${isAdm?'linear-gradient(135deg,#e83e5a,#ff7a3d)':isBanned?'linear-gradient(135deg,#666,#888)':'linear-gradient(135deg,#8b5cf6,#38bdf8)'};display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:800;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.12)">${dispName[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
              <span style="font-size:13px;font-weight:700;color:${isBanned?'#aaa':'#222'};${isBanned?'text-decoration:line-through':''}">${dispName}</span>
              ${isAdm?'<span style="font-size:8px;font-weight:800;color:#fff;background:linear-gradient(135deg,#e83e5a,#ff7a3d);padding:2px 6px;border-radius:5px">ADMIN</span>':''}
              ${isMe?'<span style="font-size:8px;font-weight:700;color:#22c55e;background:rgba(34,197,94,.1);padding:2px 7px;border-radius:5px">TY</span>':''}
            </div>
            <div style="font-size:10px;color:#aaa">${a.email}</div>
            <div style="font-size:9px;color:#ccc;margin-top:2px">Naposledy přihlášen: ${lastLogin}</div>
          </div>
          <span style="padding:4px 10px;border-radius:10px;font-size:9px;font-weight:700;background:${statusBg};color:${statusC};flex-shrink:0">${statusT}</span>
          ${!isMe?`
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button onclick="mkAdmin('${a.id}')" title="${isAdm?'Odebrat práva admina':'Povýšit na admina'}"
              style="padding:6px 12px;border-radius:10px;border:1.5px solid ${isAdm?'rgba(232,62,90,.3)':'rgba(139,92,246,.3)'};background:${isAdm?'rgba(232,62,90,.08)':'rgba(139,92,246,.08)'};color:${isAdm?'#e83e5a':'#8b5cf6'};font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s">
              ${isAdm?'👑 Odebrat admina':'👑 Dát admina'}
            </button>
            ${!isAdm?`<button onclick="banUsr('${a.id}')" title="${isBanned?'Odbanovat':'Zabanovat'}"
              style="padding:6px 12px;border-radius:10px;border:1.5px solid ${isBanned?'rgba(34,197,94,.3)':'rgba(249,115,22,.3)'};background:${isBanned?'rgba(34,197,94,.08)':'rgba(249,115,22,.08)'};color:${isBanned?'#16a34a':'#d97706'};font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s">
              ${isBanned?'✓ Unban':'⛔ Ban'}
            </button>`:''}
          </div>`:'<span style="font-size:11px;color:#ddd;padding:0 8px">—</span>'}
        </div>`;}).join('');

      // Content tab
      const ac=document.getElementById('adminContent');
      if(ac){ac.innerHTML=[
        {l:'Klipy v editu',v:clips.length,i:'🎬',c:'#8b5cf6',detail:clips.map(c=>c.name).join(', ')||'Žádné',btn:clips.length?`<button onclick="nav('editor')" style="margin-top:8px;padding:6px 14px;border-radius:10px;border:1.5px solid rgba(139,92,246,.3);background:rgba(139,92,246,.08);color:#8b5cf6;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">→ Otevřít editor</button>`:''},
        {l:'Střihy',v:cuts.length,i:'✂️',c:'#e83e5a',detail:cuts.map(c=>fmt(c)).join(' · ')||'Žádné',btn:''},
        {l:'Audio stopy',v:mTr.length,i:'🎵',c:'#f472b6',detail:mTr.map(t=>t.name).join(', ')||'Žádné',btn:mTr.length?`<button onclick="nav('editor');setTimeout(()=>showTab('mu'),50)" style="margin-top:8px;padding:6px 14px;border-radius:10px;border:1.5px solid rgba(244,114,182,.3);background:rgba(244,114,182,.08);color:#f472b6;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">→ Hudební záložka</button>`:''},
        {l:'Registrovaných účtů',v:allAccounts.length,i:'👥',c:'#38bdf8',detail:allAccounts.map(a=>a.edited_name||a.email).join(', ')||'Žádné',btn:''},
      ].map(s=>`
        <div class="g" style="border-radius:18px;padding:18px;position:relative;overflow:hidden">
          <div style="position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,${s.c}18,transparent 70%);pointer-events:none"></div>
          <div style="font-size:26px;margin-bottom:8px">${s.i}</div>
          <div style="font-size:26px;font-weight:900;color:${s.c};margin-bottom:3px">${s.v}</div>
          <div style="font-size:12px;font-weight:700;color:#333;margin-bottom:6px">${s.l}</div>
          <div style="font-size:10px;color:#bbb;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.detail}">${s.detail||'—'}</div>
          ${s.btn}
        </div>`).join('');}
    }

    window.banUsr=function(id){
      const a=allProfiles.find(x=>x.id===id);
      if(!a)return;
      const newStatus=a.edited_status==='banned'?'approved':'banned';
      sb.from('profiles').update({edited_status:newStatus}).eq('id',id).then(({error})=>{
        if(error){alert('Chyba: '+error.message);return}
        a.edited_status=newStatus;
        renderAdmin();
        confetti(newStatus==='banned'?'⛔ Uživatel zabanován':'✅ Uživatel odbanován',newStatus==='banned'?'⛔':'✅');
      });
    };
    window.mkAdmin=function(id){
      const a=allProfiles.find(x=>x.id===id);
      if(!a)return;
      const makeAdmin=a.edited_role!=='admin';
      const name=a.edited_name||a.email;
      if(!confirm(makeAdmin?('Povýšit "'+name+'" na admina? Uvidí admin panel a bude moct spravovat uživatele.'):('Odebrat adminská práva uživateli "'+name+'"?')))return;
      sb.from('profiles').update({edited_role:makeAdmin?'admin':'user'}).eq('id',id).then(({error})=>{
        if(error){alert('Chyba: '+error.message);return}
        a.edited_role=makeAdmin?'admin':'user';
        renderAdmin();
        confetti(makeAdmin?'👑 '+name+' je teď admin!':'Adminská práva odebrána','👑');
      });
    };
    updAdmin();
  }
  renderCl();
} // end showApp

// ═══ NAV ═══
function nav(id){['Home','Editor','Ai','Admin'].forEach(v=>{const el=document.getElementById('v'+v);if(el)el.style.display='none'});
  const el=document.getElementById('v'+id.charAt(0).toUpperCase()+id.slice(1));if(!el)return;
  if(id==='editor'){el.style.display='flex';el.style.flexDirection='row'}
  else if(id==='ai'){el.style.display='flex';el.style.flexDirection='column'}
  else{el.style.display='block'}
  ['nH','nE','nA','nAd'].forEach(n=>{const b=document.getElementById(n);if(b)b.classList.remove('on')});
  const map={home:'nH',editor:'nE',ai:'nA',admin:'nAd'};const nb=document.getElementById(map[id]);if(nb)nb.classList.add('on')}
window.nav=nav;

function dlApp(){const a=document.createElement('a');a.href='data:text/html;charset=utf-8,'+encodeURIComponent('<!DOCTYPE html>'+document.documentElement.outerHTML);a.download='edited.html';a.click();}
window.dlApp=dlApp;

// ═══ START APP ═══
function showConnError(detail){
  R.style.cssText='height:100vh;display:flex;align-items:center;justify-content:center';
  R.innerHTML=`<div class="g" style="padding:36px 32px;border-radius:28px;width:420px;max-width:94vw;text-align:center;animation:fadeUp .5s ease">
    <div style="font-size:48px;margin-bottom:14px">📡</div>
    <h2 style="font-size:20px;font-weight:800;color:#1a1a2e;margin-bottom:8px">Nelze se připojit</h2>
    <p style="font-size:13px;color:#888;line-height:1.6;margin-bottom:6px">${detail}</p>
    <p style="font-size:11px;color:#bbb;line-height:1.6;margin-bottom:18px">Zkontroluj internetové připojení a vypni blokátor reklam / Tracking Prevention pro tuto stránku. V náhledu uvnitř chatu appka nefunguje — otevři ji na edited-video.vercel.app.</p>
    <button onclick="location.reload()" class="btnprimary" style="width:auto;padding:12px 28px">🔄 Zkusit znovu</button>
  </div>`;
}

if(!sb){
  showConnError('Nepodařilo se načíst připojovací knihovnu (CDN).');
} else {
  tryAutoLogin().catch(err=>{
    console.error('Startup error:',err);
    showConnError('Spojení se serverem selhalo ("Failed to fetch").');
  });
}
</script>
</body>
